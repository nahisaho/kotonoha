id: data-report
base_template: null
intent:
  - KPI review
  - research findings
  - operational report
  - analytical recommendation
canvas:
  aspect_ratio: "16:9"
  width_in: 13.333
  height_in: 7.5
  safe_area_percent: 6
  grid_columns: 12
  max_content_blocks: 4
colors:
  background: "#FFFFFF"
  surface: "#F4F7FA"
  text_primary: "#152238"
  text_secondary: "#5D6B82"
  accent: "#006C8F"
  accent_soft: "#D9F0F7"
  positive: "#2E7D32"
  warning: "#8C5200"
  critical: "#B3261E"
  chart_sequence:
    - "#006C8F"
    - "#7A5AF8"
    - "#2E7D32"
    - "#D97706"
    - "#78909C"
typography:
  heading_font: "Aptos Display"
  body_font: "Aptos"
  numeric_font: "Aptos"
  title_size_pt: 28
  section_title_size_pt: 24
  body_size_pt: 17
  metric_size_pt: 34
  caption_size_pt: 10
  title_weight: 700
  body_line_spacing: 1.12
spacing:
  outer_margin_percent: 6
  content_gap_percent: 2
  card_padding_percent: 2
components:
  cards:
    corner_radius: medium
    border: none
    shadow: none
  callouts:
    use_accent_bar: false
    maximum_per_slide: 1
  tables:
    header_fill: accent_soft
    header_text: text_primary
    zebra_rows: true
    maximum_rows: 8
  charts:
    style: analytical
    gridlines: minimal
    direct_labels_preferred: true
    source_note_required: true
    zero_baseline_required_for_bars: true
  diagrams:
    connector_style: simple
    maximum_nodes: 6
slide_patterns:
  - title
  - key-findings
  - metric-scorecard
  - trend
  - comparison
  - distribution
  - drivers
  - implication
  - recommendation
  - appendix-method
accessibility:
  minimum_body_size_pt: 15
  minimum_contrast_ratio: 4.5
  never_use_color_alone: true
  alt_text_required: true
constraints:
  - one primary message per slide
  - assertion title required
  - chart axes and units must be visible
  - uncertainty and sample size must be disclosed
  - three-dimensional charts are prohibited
deviations: []
