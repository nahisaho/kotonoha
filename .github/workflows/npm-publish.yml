name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate authentication and package without publishing
        type: boolean
        default: true
      expected_sha256:
        description: Optional approved tarball SHA-256; stop on mismatch
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test package
        run: npm test

      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set NPM_TOKEN in the repository or npm-publish environment secrets."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack release artifact
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          TARBALL=$(node -p "require(process.argv[1])[0].filename" "$RUNNER_TEMP/npm-pack.json")
          sha256sum "$TARBALL"
          if [ -n "$EXPECTED_SHA256" ]; then
            if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::expected_sha256 must be a lowercase SHA-256 digest."
              exit 1
            fi
            printf '%s  %s\n' "$EXPECTED_SHA256" "$TARBALL" | sha256sum --check
          fi
          printf 'tarball=%s\n' "$TARBALL" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}

      - name: Publish package
        run: |
          TAG=$(node bin/npm-publish-tag.js)
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "./$TARBALL" --dry-run --access public --tag "$TAG"
          else
            npm publish "./$TARBALL" --access public --tag "$TAG"
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
