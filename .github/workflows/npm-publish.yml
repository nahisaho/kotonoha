name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate authentication and package without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test package
        run: npm test

      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set NPM_TOKEN in the repository or npm-publish environment secrets."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        run: |
          TAG=$(node bin/npm-publish-tag.js)
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public --tag "$TAG"
          else
            npm publish --access public --tag "$TAG"
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
